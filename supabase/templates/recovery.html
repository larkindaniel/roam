<h2>Reset your Roam password</h2>
<p>Enter this code in the Roam app to choose a new password:</p>
<p style="font-size:24px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
<p>Or open this link on the device where Roam is installed:</p>
<p><a href="{{ .ConfirmationURL }}">Reset my password</a></p>
<p>The code and link expire after one hour. If you didn't ask to reset your password, you can ignore this email.</p>
